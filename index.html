<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ユニ・シェア (Uni-Share)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#f4f7f6',
                            100: '#e2ece9',
                            500: '#52796F',
                            600: '#3F5E55',
                            700: '#354F52',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sage-50 text-slate-800 font-sans antialiased pb-24 select-none">

    <!-- モバイルヘッダー -->
    <header class="bg-white/90 backdrop-blur-md border-b border-sage-100 sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-xs">
        <div class="flex items-center space-x-2">
            <div class="bg-sage-500 text-white p-1.5 rounded-lg shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            <h1 id="header-title" class="text-base font-bold text-sage-700 tracking-tight">ユニ・シェア (ログイン)</h1>
        </div>
        
        <!-- ログイン中のみポイントを表示 -->
        <div id="header-points-area" class="flex items-center bg-sage-100 text-sage-700 px-3 py-1 rounded-full font-semibold text-xs shadow-inner hidden">
            <span>💎 <span id="user-points">120</span>pt</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- VIEW 1: ホーム (投稿一覧) -->
        <div id="view-home" class="space-y-4 hidden">
            <div class="flex space-x-1 bg-sage-100/70 p-1 rounded-xl text-xs font-medium">
                <button onclick="filterPosts('all')" id="btn-all" class="filter-btn flex-1 py-2 rounded-lg bg-white text-sage-700 shadow-xs transition text-center font-bold">すべて</button>
                <button onclick="filterPosts('過去問・ノート共有')" id="btn-past" class="filter-btn flex-1 py-2 rounded-lg text-slate-600 transition text-center">過去問</button>
                <button onclick="filterPosts('勉強の質問')" id="btn-question" class="filter-btn flex-1 py-2 rounded-lg text-slate-600 transition text-center">質問</button>
                <button onclick="filterPosts('履修登録・時間割の相談')" id="btn-consult" class="filter-btn flex-1 py-2 rounded-lg text-slate-600 transition text-center">履修相談</button>
            </div>
            <div id="posts-container" class="space-y-3">
                <p class="text-center text-xs text-slate-400 py-6">読み込み中...</p>
            </div>
        </div>

        <!-- VIEW 2: チャット (モック) -->
        <div id="view-chat" class="space-y-3 hidden">
            <div class="bg-white p-3 rounded-2xl border border-sage-100 shadow-xs flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-sage-200 flex items-center justify-center font-bold text-sage-700 text-sm">ユ</div>
                    <div>
                        <h4 id="active-chat-partner" class="font-bold text-xs text-slate-800">ユーザー (チャット)</h4>
                        <p class="text-[11px] text-slate-500 truncate">お気軽にご相談ください！</p>
                    </div>
                </div>
                <span class="text-[10px] bg-sage-500 text-white px-2 py-0.5 rounded-full">オンライン</span>
            </div>

            <div class="bg-white rounded-2xl border border-sage-100 shadow-xs flex flex-col h-[70vh]">
                <div class="p-3 border-b border-slate-100 flex items-center justify-between bg-sage-50/50 rounded-t-2xl">
                    <span id="chat-room-name" class="font-bold text-xs text-sage-700">💬 チャットルーム</span>
                    <span class="text-[10px] text-emerald-600 font-medium">● 接続中</span>
                </div>

                <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-3 text-xs">
                    <div class="flex justify-start">
                        <div class="bg-slate-100 text-slate-700 p-2.5 rounded-2xl rounded-tl-none max-w-[80%]">こんにちは！チャット機能は現在開発中です。</div>
                    </div>
                </div>

                <div class="p-3 border-t border-slate-100 bg-white rounded-b-2xl">
                    <form id="chat-form" onsubmit="sendChatMessage(event)" class="flex gap-2 items-center">
                        <input type="text" id="chat-input" placeholder="メッセージを入力..." class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-sage-500 bg-slate-50 outline-none">
                        <button type="submit" class="bg-sage-500 hover:bg-sage-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm transition">送信</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- VIEW 3: マイページ ＆ ログイン -->
        <div id="view-mypage" class="space-y-4">
            
            <!-- 🔑 ログイン・登録フォーム (未ログイン時) -->
            <div id="auth-container" class="bg-white p-5 rounded-2xl border border-sage-100 shadow-xs space-y-4">
                <div class="text-center space-y-1">
                    <h3 id="auth-form-title" class="font-bold text-sm text-sage-700">🔐 ログイン / アカウント作成</h3>
                    <p class="text-[11px] text-slate-500">大学メールアドレスで認証してください (.ac.jp)</p>
                </div>
                
                <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3 text-xs">
                    <div id="name-field-container" class="hidden">
                        <label class="block font-medium text-slate-600 mb-1">表示名（ニックネーム）</label>
                        <input type="text" id="auth-display-name" placeholder="例：経済学部 鈴木" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-600 mb-1">メールアドレス</label>
                        <input type="email" id="auth-email" required placeholder="univ@xxx.ac.jp" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-600 mb-1">パスワード</label>
                        <input type="password" id="auth-password" required placeholder="6文字以上" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 outline-none">
                    </div>
                    <button type="submit" id="auth-submit-btn" class="w-full bg-sage-500 text-white font-bold py-2.5 rounded-xl shadow-md transition">ログインする</button>
                </form>

                <div class="flex flex-col space-y-2 text-center text-[11px] pt-3 border-t border-slate-100">
                    <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-sage-600 font-semibold hover:underline">アカウントをお持ちでない方はこちら（新規登録）</button>
                </div>
            </div>

            <!-- 👤 プロフィール画面 (ログイン時) -->
            <div id="profile-container" class="bg-white p-5 rounded-2xl border border-sage-100 shadow-xs text-center space-y-4 hidden">
                <div class="w-16 h-16 bg-sage-200 rounded-full mx-auto flex items-center justify-center text-xl font-bold text-sage-700 shadow-inner">私</div>
                <div>
                    <h3 id="profile-name" class="font-bold text-sm text-slate-800">読み込み中...</h3>
                    <p id="profile-email" class="text-[11px] text-slate-500"></p>
                </div>
                
                <!-- 保有ポイントカード -->
                <div class="bg-sage-50 border border-sage-100 p-3 rounded-xl flex justify-between items-center px-4">
                    <span class="text-xs text-slate-600 font-medium">保有ポイント</span>
                    <span class="text-sm font-bold text-sage-700">💎 <span id="profile-points">120</span> pt</span>
                </div>

                <div class="inline-block bg-emerald-50 border border-emerald-200 text-emerald-700 text-[10px] font-bold px-3 py-1 rounded-full">
                    🌟 認証済み学生ユーザー
                </div>

                <div class="text-left pt-3 border-t border-slate-100 space-y-2 text-xs">
                    <label class="block font-medium text-slate-600">プロフィール編集</label>
                    <input type="text" id="edit-display-name" placeholder="表示名" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50">
                    <textarea id="edit-bio" rows="2" placeholder="自己紹介や履修している分野など..." class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50"></textarea>
                    <button onclick="updateProfile()" class="w-full bg-sage-600 hover:bg-sage-700 text-white font-bold py-2 rounded-xl transition shadow-xs">保存する</button>
                </div>

                <!-- 📊 ポイント履歴セクション -->
                <div class="text-left pt-4 border-t border-slate-100 space-y-2">
                    <h4 class="font-bold text-xs text-sage-700 flex items-center gap-1">📜 ポイント獲得・利用履歴</h4>
                    <div id="point-history-container" class="space-y-1.5 max-h-40 overflow-y-auto text-xs">
                        <p class="text-center text-slate-400 py-2 text-[11px]">履歴はありません</p>
                    </div>
                </div>

                <button onclick="handleSignOut()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold py-2.5 rounded-xl text-xs transition border border-rose-200 mt-4">
                    ログアウトする
                </button>
            </div>
        </div>

    </main>

    <!-- 新規投稿モーダル -->
    <div id="post-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-xs">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 class="font-bold text-sage-700 text-base">✍️ 新規投稿・相談する</h2>
                <button onclick="toggleModal(false)" class="text-slate-400 font-bold px-2">✕</button>
            </div>
            
            <form id="post-form" onsubmit="handleCreatePost(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ポストの種類</label>
                    <select id="post-type" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs bg-slate-50">
                        <option value="過去問・ノート共有">📁 過去問・ノート共有</option>
                        <option value="勉強の質問">❓ 勉強の質問</option>
                        <option value="履修登録・時間割の相談">📅 履修登録・時間割の相談</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">タイトル</label>
                    <input type="text" id="post-title" required placeholder="例：経済学概論 中間テスト過去問" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">詳細・内容</label>
                    <textarea id="post-desc" required rows="3" placeholder="詳細を記入..." class="w-full border border-slate-200 rounded-xl p-2.5 text-xs bg-slate-50"></textarea>
                </div>
                <button type="submit" class="w-full bg-sage-500 text-white font-bold py-3 rounded-xl text-xs shadow-md">投稿する (+30pt)</button>
            </form>
        </div>
    </div>

    <!-- モバイル下部ナビゲーションバー (未ログイン時は非表示) -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-sage-100 py-2 px-6 flex justify-around items-center z-40 shadow-lg hidden">
        <button onclick="switchTab('home', this)" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]">
            <span class="text-lg">🏠</span>ホーム
        </button>
        <button onclick="switchTab('chat', this)" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]">
            <span class="text-lg">💬</span>チャット
        </button>
        <button onclick="toggleModal(true)" class="flex flex-col items-center text-white bg-sage-500 hover:bg-sage-600 px-4 py-2 rounded-2xl shadow-md -mt-5 transition">
            <span class="text-xl font-bold leading-none">+</span>
            <span class="text-[10px] mt-0.5">投稿</span>
        </button>
        <button onclick="switchTab('mypage', this)" class="nav-btn flex flex-col items-center text-sage-600 text-[10px] font-bold">
            <span class="text-lg">👤</span>マイページ
        </button>
    </nav>

    <!-- ▼▼▼ Supabase & アプリケーションロジック ▼▼▼ -->
    <script>
        const SUPABASE_URL = 'https://qirddzdxyfdzgmckjbkt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_cbZUYYvEy2IdTEOH495zAw_uGhTKsci';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentFilter = 'all';
        let isSignUpMode = false;
        let currentUser = null;

        // 初期化処理
        window.addEventListener('DOMContentLoaded', async () => {
            await checkSession();
        });

        // 🟢 ログイン状態の確認（未ログインなら下部バーを隠し、ログイン画面を強制表示）
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authContainer = document.getElementById('auth-container');
            const profileContainer = document.getElementById('profile-container');
            const bottomNav = document.getElementById('bottom-nav');
            const headerPointsArea = document.getElementById('header-points-area');

            if (session) {
                currentUser = session.user;
                authContainer.classList.add('hidden');
                profileContainer.classList.remove('hidden');
                bottomNav.classList.remove('hidden');
                headerPointsArea.classList.remove('hidden');
                
                await loadProfileData(session.user);
                switchTab('home', document.querySelectorAll('.nav-btn')[0]);
            } else {
                currentUser = null;
                authContainer.classList.remove('hidden');
                profileContainer.classList.add('hidden');
                bottomNav.classList.add('hidden'); // 未ログイン時は下部バーを隠す
                headerPointsArea.classList.add('hidden');
                
                switchTab('mypage', null); // 未ログイン時はマイページ（ログイン画面）を強制
            }
        }

        // 👤 プロフィール＆ポイント情報の読み込み
        async function loadProfileData(user) {
            document.getElementById('profile-email').innerText = user.email;
            
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                document.getElementById('profile-name').innerText = profile.display_name || '名無しさん';
                document.getElementById('edit-display-name').value = profile.display_name || '';
                document.getElementById('edit-bio').value = profile.bio || '';
                
                const points = profile.points ?? 120;
                document.getElementById('user-points').innerText = points;
                document.getElementById('profile-points').innerText = points;
            }

            await loadPointHistory(user.id);
        }

        // 📜 ポイント履歴の取得＆表示
        async function loadPointHistory(userId) {
            const container = document.getElementById('point-history-container');
            if(!container) return;

            const { data: histories, error } = await supabaseClient
                .from('point_history')
                .select('*')
                .eq('user_id', userId)
                .order('created_at', { ascending: false });

            if (error || !histories || histories.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-2 text-[11px]">履歴はありません</p>`;
                return;
            }

            container.innerHTML = '';
            histories.forEach(h => {
                const dateStr = new Date(h.created_at).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                const isPlus = h.amount > 0;
                const sign = isPlus ? '+' : '';
                const colorClass = isPlus ? 'text-emerald-600' : 'text-rose-500';

                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100 text-[11px]';
                item.innerHTML = `
                    <div>
                        <p class="font-bold text-slate-700">${h.reason}</p>
                        <p class="text-[10px] text-slate-400">${dateStr}</p>
                    </div>
                    <span class="font-bold ${colorClass}">${sign}${h.amount} pt</span>
                `;
                container.appendChild(item);
            });
        }

        // ✍️ プロフィール情報の更新
        async function updateProfile() {
            if (!currentUser) return;

            const displayName = document.getElementById('edit-display-name').value;
            const bio = document.getElementById('edit-bio').value;

            const { error } = await supabaseClient
                .from('profiles')
                .update({ display_name: displayName, bio: bio })
                .eq('id', currentUser.id);

            if (error) {
                alert('更新エラー: ' + error.message);
            } else {
                alert('プロフィールを更新しました！');
                loadProfileData(currentUser);
            }
        }

        // 🔑 認証処理（ログイン / 新規登録）
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (isSignUpMode) {
                const displayName = document.getElementById('auth-display-name').value;
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { display_name: displayName }
                    }
                });
                
                if (error) {
                    alert('登録エラー: ' + error.message);
                } else {
                    if (data.user) {
                        await supabaseClient.from('point_history').insert([{
                            user_id: data.user.id,
                            amount: 120,
                            reason: '新規登録ボーナス'
                        }]);
                    }
                    alert('登録成功！確認メールを送信しました。メール内のリンクを確認してください。');
                }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    alert('ログイン失敗: ' + error.message);
                } else {
                    alert('ログインしました！');
                    checkSession();
                }
            }
        }

        // 🚪 ログアウト処理
        async function handleSignOut() {
            if(confirm('ログアウトしますか？')) {
                await supabaseClient.auth.signOut();
                checkSession();
                alert('ログアウトしました');
            }
        }

        // 🔄 ログイン / 新規登録の画面切り替え
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const titleEl = document.getElementById('auth-form-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const toggleBtn = document.getElementById('auth-toggle-btn');
            const nameField = document.getElementById('name-field-container');

            if (isSignUpMode) {
                titleEl.innerText = '✨ 新規アカウント登録';
                submitBtn.innerText = '登録する';
                toggleBtn.innerText = 'すでにアカウントをお持ちの方はこちら（ログイン）';
                nameField.classList.remove('hidden');
            } else {
                titleEl.innerText = '🔐 ログイン';
                submitBtn.innerText = 'ログインする';
                toggleBtn.innerText = 'アカウントをお持ちでない方はこちら（新規登録）';
                nameField.classList.add('hidden');
            }
        }

        // 📥 データベースから投稿一覧を取得
        async function fetchPosts() {
            const { data: posts, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            const container = document.getElementById('posts-container');
            if (!container) return;

            if (error) {
                container.innerHTML = `<p class="text-center text-xs text-rose-500 py-4">データ取得エラー: ${error.message}</p>`;
                return;
            }

            if (posts.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">まだ投稿はありません。</p>`;
                return;
            }

            container.innerHTML = '';
            posts.forEach(post => {
                const dateStr = new Date(post.created_at).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                let deleteBtn = '';
                if (currentUser && currentUser.id === post.user_id) {
                    deleteBtn = `<button onclick="deletePost(${post.id})" class="text-[10px] text-rose-500 font-bold ml-2">削除</button>`;
                }

                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl shadow-xs border border-sage-100 space-y-2';
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] text-slate-400">${dateStr}</span>
                        ${deleteBtn}
                    </div>
                    <h3 class="font-bold text-slate-800 text-sm leading-snug">${post.title}</h3>
                    <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-wrap">${post.content}</p>
                `;
                container.appendChild(card);
            });
        }

        // 📝 新規投稿をデータベースに保存 ＆ ポイント加算(+30pt)
        async function handleCreatePost(e) {
            e.preventDefault();
            if (!currentUser) {
                alert('投稿するにはログインが必要です。');
                return;
            }

            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-desc').value;

            const { error: postError } = await supabaseClient
                .from('posts')
                .insert([{ user_id: currentUser.id, title: title, content: content }]);

            if (postError) {
                alert('投稿エラー: ' + postError.message);
                return;
            }

            const { data: profile } = await supabaseClient.from('profiles').select('points').eq('id', currentUser.id).single();
            const currentPoints = profile?.points ?? 120;
            const newPoints = currentPoints + 30;

            await supabaseClient.from('profiles').update({ points: newPoints }).eq('id', currentUser.id);

            await supabaseClient.from('point_history').insert([{
                user_id: currentUser.id,
                amount: 30,
                reason: '過去問・ノートのシェア投稿報酬'
            }]);

            alert('✨ 投稿が完了しました！ (+30pt 獲得)');
            document.getElementById('post-form').reset();
            toggleModal(false);
            loadProfileData(currentUser);
            fetchPosts();
        }

        // 🗑️ 投稿の削除
        async function deletePost(postId) {
            if(!confirm('本当にこの投稿を削除しますか？')) return;

            const { error } = await supabaseClient.from('posts').delete().eq('id', postId);
            if (error) {
                alert('削除エラー: ' + error.message);
            } else {
                fetchPosts();
            }
        }

        // 🔀 タブ切り替え制御（未ログイン時はマイページ以外への移動をブロック）
        function switchTab(tabName, btnElement) {
            if (!currentUser && tabName !== 'mypage') {
                return;
            }

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-chat').classList.add('hidden');
            document.getElementById('view-mypage').classList.add('hidden');

            document.getElementById('view-' + tabName).classList.remove('hidden');

            const titles = { home: 'ユニ・シェア (ホーム)', chat: 'ユニ・シェア (チャット)', mypage: 'ユニ・シェア (マイページ)' };
            document.getElementById('header-title').innerText = titles[tabName];

            if (currentUser && btnElement) {
                document.querySelectorAll('.nav-btn').forEach(b => b.className = 'nav-btn flex flex-col items-center text-slate-400 text-[10px]');
                btnElement.className = 'nav-btn flex flex-col items-center text-sage-600 text-[10px] font-bold';
            }
            
            if(tabName === 'home') {
                fetchPosts();
            } else if(tabName === 'mypage' && currentUser) {
                loadProfileData(currentUser);
            }
        }

        function filterPosts(type) {
            currentFilter = type;
            ['all', 'past', 'question', 'consult'].forEach((id, index) => {
                const btnKeys = ['all', '過去問・ノート共有', '勉強の質問', '履修登録・時間割の相談'];
                const btn = document.querySelectorAll('.filter-btn')[index];
                if(btnKeys[index] === type) {
                    btn.className = 'filter-btn flex-1 py-2 rounded-lg bg-white text-sage-700 shadow-xs transition text-center text-xs font-bold';
                } else {
                    btn.className = 'filter-btn flex-1 py-2 rounded-lg text-slate-600 transition text-center text-xs';
                }
            });
            fetchPosts();
        }

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            const chatMessages = document.getElementById('chat-messages');
            const msg = document.createElement('div');
            msg.className = 'flex justify-end';
            msg.innerHTML = `<div class="bg-sage-500 text-white p-2.5 rounded-2xl rounded-tr-none max-w-[80%]">${text}</div>`;
            chatMessages.appendChild(msg);

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function toggleModal(show) {
            if (!currentUser) return;
            document.getElementById('post-modal').classList.toggle('hidden', !show);
        }
    </script>
</body>
</html>
